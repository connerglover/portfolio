<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="CG">
  <!--
    One stroke doing double duty: the arc is the C, and the stem and bar that
    close it turn the same arc into a G. Two letters, one continuous path —
    which is also the only way a two-letter monogram survives 16px.
  -->
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="100" height="100" rx="22" fill="#0b0e0d"/>
  <rect width="100" height="100" rx="22" fill="url(#glow)"/>
  <rect x="0.75" y="0.75" width="98.5" height="98.5" rx="21.25"
        fill="none" stroke="#232b28" stroke-width="1.5"/>

  <path d="M 67.24 27.94 A 28 28 0 1 0 67.24 72.06 V 50 H 51"
        fill="none" stroke="url(#ink)" stroke-width="11"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
