<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="C">
  <!--
    A single geometric arc: r=28, stroke 12, a 100-degree aperture with round
    terminals. One letter is the only thing that stays legible at 16px, and it
    is the shape the rest of the site is already built from - the same circle
    and the same emerald as the cursor glow.
  -->
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="100" height="100" rx="22" fill="#0b0e0d"/>
  <rect width="100" height="100" rx="22" fill="url(#glow)"/>
  <rect x="0.75" y="0.75" width="98.5" height="98.5" rx="21.25"
        fill="none" stroke="#232b28" stroke-width="1.5"/>

  <path d="M 68 28.55 A 28 28 0 1 0 68 71.45"
        fill="none" stroke="url(#ink)" stroke-width="12"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
